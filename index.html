<!DOCTYPE html>
<html lang="es" data-mode="dark" data-wallpaper="bloom" data-state="boot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portafolio — PortfolioOS</title>
  <meta name="description" content="Portafolio personal con forma de sistema operativo: proyectos, experiencia, habilidades y contacto." />
  <meta name="color-scheme" content="dark light" />
  <script>
    // Aplica los ajustes guardados antes del primer pintado (sin parpadeo)
    try {
      var d = document.documentElement, s = localStorage, m = s.getItem("pf-mode") || "system";
      if (m === "system") m = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      d.setAttribute("data-mode", m);
      d.setAttribute("data-wallpaper", s.getItem("pf-wallpaper") || "bloom");
      if (s.getItem("pf-accent")) d.style.setProperty("--os-accent", s.getItem("pf-accent"));
      if (s.getItem("pf-os-booted") || location.hash.length > 1) d.setAttribute("data-state", "desktop");
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>

  <!-- Arranque -->
  <div class="boot" id="boot" aria-label="Iniciando">
    <svg class="boot-logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="10.5" height="10.5" rx="1"/><rect x="12.5" y="1" width="10.5" height="10.5" rx="1"/><rect x="1" y="12.5" width="10.5" height="10.5" rx="1"/><rect x="12.5" y="12.5" width="10.5" height="10.5" rx="1"/></svg>
    <svg class="spinner" viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="20"/></svg>
  </div>

  <!-- Pantalla de bloqueo -->
  <div class="lock" id="lock" tabindex="-1" aria-label="Pantalla de bloqueo">
    <div class="lock-clock">
      <p class="lock-time" id="lock-time"></p>
      <p class="lock-date" id="lock-date"></p>
    </div>
    <p class="lock-hint">Haz clic, pulsa una tecla o desliza hacia arriba para desbloquear</p>
    <div class="lock-login">
      <div class="avatar lock-avatar" id="lock-avatar"></div>
      <p class="lock-name" id="lock-name"></p>
      <button type="button" class="login-btn" id="login-btn">Iniciar sesión</button>
      <div class="lock-welcome">
        <svg class="spinner spinner-sm" viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="20"/></svg>
        <span>Te damos la bienvenida</span>
      </div>
    </div>
  </div>

  <!-- Escritorio -->
  <div class="os" id="os">
    <main class="desktop" id="desktop" aria-label="Escritorio">
      <aside class="widget" id="widget" aria-label="Presentación"></aside>
      <ul class="desktop-icons" id="desktop-icons" aria-label="Iconos del escritorio"></ul>
    </main>

    <div class="windows" id="windows">
      <div class="snap-preview" id="snap-preview" aria-hidden="true"></div>
    </div>

    <div class="start" id="start" role="dialog" aria-label="Inicio" hidden>
      <label class="start-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <input id="start-input" type="text" spellcheck="false" autocomplete="off" placeholder="Busca apps, proyectos y ajustes" aria-label="Buscar" />
      </label>
      <div class="start-body">
        <div id="start-home">
          <h3 class="start-h">Anclado</h3>
          <div class="start-grid" id="start-pinned"></div>
          <h3 class="start-h">Recomendado</h3>
          <div class="start-recs" id="start-recs"></div>
        </div>
        <div class="start-results" id="start-results" role="listbox" aria-label="Resultados" hidden></div>
      </div>
      <footer class="start-foot">
        <button type="button" class="start-user" id="start-user" title="Bloquear">
          <span class="avatar" id="start-avatar"></span><span id="start-name"></span>
        </button>
        <button type="button" class="start-power" id="start-power" title="Reiniciar" aria-label="Reiniciar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
        </button>
      </footer>
    </div>

    <div class="ctx" id="ctx" role="menu" hidden></div>

    <nav class="taskbar" aria-label="Barra de tareas">
      <div class="task-center">
        <button type="button" class="task-btn start-btn" id="start-btn" title="Inicio (Ctrl K)" aria-label="Inicio" aria-expanded="false">
          <svg class="start-logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9.5" height="9.5" rx="1"/><rect x="12.5" y="2" width="9.5" height="9.5" rx="1"/><rect x="2" y="12.5" width="9.5" height="9.5" rx="1"/><rect x="12.5" y="12.5" width="9.5" height="9.5" rx="1"/></svg>
        </button>
        <button type="button" class="task-btn" id="search-btn" title="Buscar" aria-label="Buscar">
          <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        </button>
        <div class="task-apps" id="task-apps"></div>
      </div>
      <div class="task-tray">
        <button type="button" class="tray-btn" id="mode-btn"></button>
        <span class="tray-status" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10.5v3"/><rect x="4.5" y="9.5" width="11" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="clock" aria-hidden="true"><span id="clock-time"></span><span id="clock-date"></span></span>
        <button type="button" class="show-desktop" id="show-desktop" title="Mostrar escritorio" aria-label="Mostrar escritorio"></button>
      </div>
    </nav>
  </div>

  <!-- Plantilla de ventana -->
  <template id="window-tpl">
    <section class="win" role="dialog" tabindex="-1">
      <header class="win-titlebar">
        <button type="button" class="win-back" aria-label="Volver al inicio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5m6-6-6 6 6 6"/></svg>
        </button>
        <span class="win-icon"></span>
        <span class="win-title"></span>
        <div class="win-controls">
          <button type="button" class="win-btn" data-action="minimize" aria-label="Minimizar" title="Minimizar">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10"/></svg>
          </button>
          <button type="button" class="win-btn" data-action="maximize" aria-label="Maximizar" title="Maximizar">
            <svg class="i-max" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1.5"/></svg>
            <svg class="i-restore" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="2.5" width="7" height="7" rx="1.2"/><path d="M2.5 2.5v-.7A1.3 1.3 0 0 1 3.8.5h4.4a1.3 1.3 0 0 1 1.3 1.3v4.4a1.3 1.3 0 0 1-1.3 1.3h-.7"/></svg>
          </button>
          <button type="button" class="win-btn win-close" data-action="close" aria-label="Cerrar" title="Cerrar">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="m.5.5 9 9m0-9-9 9"/></svg>
          </button>
        </div>
      </header>
      <div class="win-body"></div>
      <div class="rz rz-n" data-dir="n"></div>
      <div class="rz rz-s" data-dir="s"></div>
      <div class="rz rz-e" data-dir="e"></div>
      <div class="rz rz-w" data-dir="w"></div>
      <div class="rz rz-ne" data-dir="ne"></div>
      <div class="rz rz-nw" data-dir="nw"></div>
      <div class="rz rz-se" data-dir="se"></div>
      <div class="rz rz-sw" data-dir="sw"></div>
    </section>
  </template>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="terminal.js"></script>
  <script src="apps.js"></script>
  <script src="games.js"></script>
  <script src="os.js"></script>
</body>
</html>
